name: Build Android APK

# Triggered only via the Cloudflare Worker, which POSTs to the GitHub
# repository_dispatch API. There is deliberately no workflow_dispatch trigger:
# that would add a "Run workflow" form with declared inputs, and the build
# parameters are free-form JSON instead.
#
# NOTE: repository_dispatch only fires if this file is on the repository's
# default branch (currently `server`).
on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Patch AppConfig.kt, app name and package name
        env:
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          WEBVIEW_URL: ${{ github.event.client_payload.webview_url }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          CONSTANTS_JSON: ${{ toJson(github.event.client_payload.constants) }}
        run: |
          cat << 'EOF' > patch.py
          import json, os, re, sys
          from xml.sax.saxutils import escape

          CONFIG_PATH  = "Splash_WebView/app/src/main/java/com/BHG/webview/AppConfig.kt"
          GRADLE_PATH  = "Splash_WebView/app/build.gradle"
          STRINGS_PATH = "Splash_WebView/app/src/main/res/values/strings.xml"

          print(f"build_id: {os.getenv('BUILD_ID', '')}")
          total = 0

          def patch(path, pattern, replacement, label):
              """Apply one substitution. Aborts the build if the pattern is absent."""
              global total
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              updated, count = re.subn(pattern, replacement, content)
              if count == 0:
                  sys.exit(f"FATAL: {label} not found in {path} - refusing to ship an unpatched APK")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)
              total += count
              print(f"  patched {label} ({count})")

          # --- target website -------------------------------------------------
          url = os.getenv("WEBVIEW_URL", "").strip()
          if not url:
              sys.exit("FATAL: webview_url is empty in the dispatch payload")
          patch(CONFIG_PATH,
                r'(const\s+val\s+HOME_URL\s*(?::\s*[\w.<>]+)?\s*=\s*)"[^"]*"',
                lambda m: f'{m.group(1)}"{url}"',
                "HOME_URL")

          # --- every other AppConfig.kt constant, driven by the payload --------
          try:
              constants = json.loads(os.getenv("CONSTANTS_JSON") or "[]")
          except json.JSONDecodeError as err:
              sys.exit(f"FATAL: constants payload is not valid JSON: {err}")
          if constants is None:
              constants = []
          if not isinstance(constants, list):
              sys.exit("FATAL: constants payload must be a JSON array")

          def const_pattern(name):
              """Matches `const val NAME: Type = <literal>` with any type annotation."""
              return rf'(const\s+val\s+{name}\s*(?::\s*[\w.<>]+)?\s*=\s*)'

          for item in constants:
              name, kind, value = item["name"], item["type"], item["value"]

              if not re.fullmatch(r"[A-Z][A-Z0-9_]*", name):
                  sys.exit(f"FATAL: refusing to patch suspicious constant name '{name}'")

              if kind == "Boolean":
                  if not isinstance(value, bool):
                      sys.exit(f"FATAL: {name} expects a boolean, got {value!r}")
                  pattern = const_pattern(name) + r'(true|false)'
                  literal = "true" if value else "false"

              elif kind in ("Int", "Long"):
                  if isinstance(value, bool) or not isinstance(value, int):
                      sys.exit(f"FATAL: {name} expects a whole number, got {value!r}")
                  pattern = const_pattern(name) + r'-?\d+L?'
                  literal = str(value)

              elif kind == "String":
                  if not isinstance(value, str):
                      sys.exit(f"FATAL: {name} expects a string, got {value!r}")
                  escaped = value.replace("\\", "\\\\").replace('"', '\\"')
                  pattern = const_pattern(name) + r'"[^"]*"'
                  literal = f'"{escaped}"'

              else:
                  sys.exit(f"FATAL: unknown constant type '{kind}' for {name}")

              patch(CONFIG_PATH, pattern, lambda m, lit=literal: m.group(1) + lit, name)

          # --- app display name -----------------------------------------------
          name = os.getenv("APP_NAME", "").strip()
          if name:
              name = re.sub(r"[\x00-\x1f\x7f]", " ", name).strip()[:50]
              # Android string resources: escape backslash, apostrophe and quote
              name = name.replace("\\", "\\\\").replace("'", "\\'").replace('"', '\\"')
              if name[:1] in ("@", "?"):
                  name = "\\" + name
              # XML text content
              name = escape(name)
              patch(STRINGS_PATH,
                    r'(<string name="app_name">).*?(</string>)',
                    lambda m: f"{m.group(1)}{name}{m.group(2)}",
                    "app_name")

          # --- application id -------------------------------------------------
          # Only applicationId changes; the namespace (and therefore the R class
          # and the source tree under com/BHG/webview) stays put.
          pkg = os.getenv("PACKAGE_NAME", "").strip()
          if pkg:
              if not re.fullmatch(r"[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+", pkg):
                  sys.exit(f"FATAL: '{pkg}' is not a valid Android package name")
              patch(GRADLE_PATH,
                    r'(applicationId\s+)"[^"]*"',
                    lambda m: f'{m.group(1)}"{pkg}"',
                    "applicationId")

          print(f"patch complete: {total} replacement(s)")
          EOF
          python3 patch.py

      - name: Show effective configuration
        run: |
          grep -n "const val" Splash_WebView/app/src/main/java/com/BHG/webview/AppConfig.kt
          grep -n "app_name" Splash_WebView/app/src/main/res/values/strings.xml
          grep -n "applicationId\|namespace" Splash_WebView/app/build.gradle

      - name: Build Debug APK
        working-directory: ./Splash_WebView
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Cloudflare Worker
        env:
          UPLOAD_WEBHOOK: ${{ github.event.client_payload.upload_webhook_url }}
          BUILD_SECRET: ${{ secrets.WORKER_BUILD_SECRET }}
        run: |
          if [ -z "$UPLOAD_WEBHOOK" ]; then
            echo "::error::upload_webhook_url missing from the dispatch payload"
            exit 1
          fi

          APK_PATH=$(find Splash_WebView/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced by the build"
            exit 1
          fi
          echo "Uploading $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"

          HTTP_CODE=$(curl -s -o /tmp/upload_response.txt -w "%{http_code}" \
            -X PUT "$UPLOAD_WEBHOOK" \
            -H "X-Build-Secret: $BUILD_SECRET" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH")

          echo "Worker responded $HTTP_CODE"
          cat /tmp/upload_response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::APK upload failed with HTTP $HTTP_CODE"
            exit 1
          fi
