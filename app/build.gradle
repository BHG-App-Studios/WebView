apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'kotlin-parcelize'
apply plugin: 'com.google.firebase.crashlytics'


android {
    namespace 'com.BHG.webapp'
    compileSdk 37
    defaultConfig {
        applicationId "com.BHG.webapp"
        minSdk 24
        targetSdk 37
        versionCode 3
        versionName "3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

}
dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs

    // AndroidX Core + UI
    implementation libs.androidx.core.ktx
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.viewpager2
    implementation libs.material

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.firestore
    implementation libs.firebase.messaging
    implementation libs.firebase.crashlytics
    implementation libs.firebase.auth

    // Google Sign-In (Credential Manager + Sign in with Google)
    implementation libs.androidx.credentials
    implementation libs.androidx.credentials.play.services.auth
    implementation libs.googleid
    implementation libs.play.services.ads

    // Google Play In-App Updates (immediate)
    implementation libs.app.update.ktx

    // BouncyCastle — builds the self-signed X.509 cert for on-device keystore
    // generation (Android has no public API to create/sign an X.509 cert).
    implementation "org.bouncycastle:bcprov-jdk15on:1.70"
    implementation "org.bouncycastle:bcpkix-jdk15on:1.70"

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
}