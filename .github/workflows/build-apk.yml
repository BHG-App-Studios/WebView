name: Build Android APK

# Triggered only via the Cloudflare Worker, which POSTs to the GitHub
# repository_dispatch API. There is deliberately no workflow_dispatch trigger:
# that would add a "Run workflow" form with declared inputs, and the build
# parameters are free-form JSON instead.
#
# NOTE: repository_dispatch only fires if this file is on the repository's
# default branch (currently `server`).
on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # The four tools/ scripts are the single source of truth for how a build
      # is customised. Each one validates its own input, writes, then re-reads
      # the file to prove the change landed - and exits non-zero if it did not.
      # `set -e` (the runner's default) turns any of those into a failed job.
      - name: Customise the Android project
        env:
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
          REMOVE_PERMISSIONS: ${{ join(github.event.client_payload.remove_permissions, ' ') }}
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD_JSON" > payload.json
          echo "Dispatch payload:"
          cat payload.json
          echo

          cd Splash_WebView

          # 1. package name - moves the source trees and rewrites namespace,
          #    applicationId, package declarations, imports and qualified names
          if [ -n "$PACKAGE_NAME" ]; then
            echo "=== rename-package.js $PACKAGE_NAME ==="
            node ../tools/rename-package.js "$PACKAGE_NAME" --project .
            echo
          fi

          # 2. AppConfig.kt values, including webview_url -> HOME_URL
          echo "=== set-app-config.js ==="
          node ../tools/set-app-config.js --json ../payload.json --project .
          echo

          # 3. launcher label
          if [ -n "$APP_NAME" ]; then
            echo "=== set-app-name.js ==="
            node ../tools/set-app-name.js "$APP_NAME"
            echo
          fi

          # 4. permissions to strip. With no names the script only lists them,
          #    so it is skipped rather than called with an empty argument list.
          if [ -n "$REMOVE_PERMISSIONS" ]; then
            echo "=== set-manifest-permissions.js $REMOVE_PERMISSIONS ==="
            node ../tools/set-manifest-permissions.js $REMOVE_PERMISSIONS
            echo
          else
            echo "=== no permissions requested for removal ==="
          fi

      - name: Show effective configuration
        working-directory: ./Splash_WebView
        run: |
          node ../tools/set-app-config.js --list --project .
          echo
          node ../tools/set-manifest-permissions.js
          echo
          grep -n "namespace\|applicationId" app/build.gradle
          grep -n "app_name" app/src/main/res/values/strings.xml

      - name: Build Debug APK
        working-directory: ./Splash_WebView
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Cloudflare Worker
        env:
          UPLOAD_WEBHOOK: ${{ github.event.client_payload.upload_webhook_url }}
          BUILD_SECRET: ${{ secrets.WORKER_BUILD_SECRET }}
        run: |
          if [ -z "$UPLOAD_WEBHOOK" ]; then
            echo "::error::upload_webhook_url missing from the dispatch payload"
            exit 1
          fi

          APK_PATH=$(find Splash_WebView/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced by the build"
            exit 1
          fi
          echo "Uploading $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"

          HTTP_CODE=$(curl -s -o /tmp/upload_response.txt -w "%{http_code}" \
            -X PUT "$UPLOAD_WEBHOOK" \
            -H "X-Build-Secret: $BUILD_SECRET" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH")

          echo "Worker responded $HTTP_CODE"
          cat /tmp/upload_response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::APK upload failed with HTTP $HTTP_CODE"
            exit 1
          fi
