name: Build Android APK

# Triggered only via the Cloudflare Worker, which POSTs to the GitHub
# repository_dispatch API. There is deliberately no workflow_dispatch trigger:
# that would add a "Run workflow" form with declared inputs, and the build
# parameters are free-form JSON instead.
#
# NOTE: repository_dispatch only fires if this file is on the repository's
# default branch (currently `server`).
on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # The four tools/ scripts are the single source of truth for how a build
      # is customised. Each one validates its own input, writes, then re-reads
      # the file to prove the change landed - and exits non-zero if it did not.
      # `set -e` (the runner's default) turns any of those into a failed job.
      - name: Customise the Android project
        env:
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
          REMOVE_PERMISSIONS: ${{ join(github.event.client_payload.remove_permissions, ' ') }}
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD_JSON" > payload.json
          echo "Dispatch payload:"
          cat payload.json
          echo

          cd Splash_WebView

          # 1. package name - moves the source trees and rewrites namespace,
          #    applicationId, package declarations, imports and qualified names
          if [ -n "$PACKAGE_NAME" ]; then
            echo "=== rename-package.js $PACKAGE_NAME ==="
            node ../tools/rename-package.js "$PACKAGE_NAME" --project .
            echo
          fi

          # 2. AppConfig.kt values, including webview_url -> HOME_URL
          echo "=== set-app-config.js ==="
          node ../tools/set-app-config.js --json ../payload.json --project .
          echo

          # 3. launcher label
          if [ -n "$APP_NAME" ]; then
            echo "=== set-app-name.js ==="
            node ../tools/set-app-name.js "$APP_NAME"
            echo
          fi

          # 4. permissions to strip. With no names the script only lists them,
          #    so it is skipped rather than called with an empty argument list.
          if [ -n "$REMOVE_PERMISSIONS" ]; then
            echo "=== set-manifest-permissions.js $REMOVE_PERMISSIONS ==="
            node ../tools/set-manifest-permissions.js $REMOVE_PERMISSIONS
            echo
          else
            echo "=== no permissions requested for removal ==="
          fi

      - name: Show effective configuration
        working-directory: ./Splash_WebView
        run: |
          node ../tools/set-app-config.js --list --project .
          echo
          node ../tools/set-manifest-permissions.js
          echo
          grep -n "namespace\|applicationId" app/build.gradle
          grep -n "app_name" app/src/main/res/values/strings.xml

      # ---------------------------------------------------------------------
      # Signing material. Passwords and keystore bytes never travel in the
      # dispatch payload (it is echoed to the log). Instead the runner fetches
      # them from the Worker's secret-gated /api/signing endpoint and writes
      # app/keystore.properties, which build.gradle reads. That file, the
      # fetched bundle and the .jks are all confined to the runner and deleted
      # before the job ends.
      #
      # Modes:
      #   debug  + auto    -> no signing config; Gradle's debug keystore is used
      #   debug  + custom  -> sign the debug build with the uploaded keystore
      #   release + auto   -> reuse keystores/{package}.jks if it exists, else
      #                       generate one with keytool and upload it back
      #   release + custom -> sign the release build with the uploaded keystore
      # ---------------------------------------------------------------------
      - name: Prepare signing material
        id: signing
        working-directory: ./Splash_WebView
        env:
          SIGNING_FETCH_URL: ${{ github.event.client_payload.build.signing_fetch_url }}
          BUILD_TYPE: ${{ github.event.client_payload.build.build_type }}
          SIGNING_MODE: ${{ github.event.client_payload.build.signing_mode }}
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          BUILD_SECRET: ${{ secrets.WORKER_BUILD_SECRET }}
        run: |
          BUILD_TYPE="${BUILD_TYPE:-debug}"
          SIGNING_MODE="${SIGNING_MODE:-auto}"
          echo "build_type=$BUILD_TYPE"   >> "$GITHUB_OUTPUT"
          echo "signing_mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"

          # Debug + auto: nothing to sign here; Gradle's default debug keystore
          # (~/.android/debug.keystore) signs it. We still package that keystore
          # for download in the "Persist & package keystore" step below.
          if [ "$BUILD_TYPE" = "debug" ] && [ "$SIGNING_MODE" = "auto" ]; then
            echo "Debug build with auto (debug) keystore - no custom signing."
            echo "keystore_source=debug-default" >> "$GITHUB_OUTPUT"
            echo "persist_key=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$SIGNING_FETCH_URL" ]; then
            echo "::error::signing_fetch_url missing from dispatch payload"
            exit 1
          fi

          # Pull the signing bundle (never printed).
          curl -s -f -H "X-Build-Secret: $BUILD_SECRET" "$SIGNING_FETCH_URL" -o /tmp/signing.json || {
            echo "::error::Could not fetch signing material"; exit 1; }

          KS_PATH="$PWD/app/release.jks"
          GENERATED=false

          if [ "$SIGNING_MODE" = "custom" ]; then
            # Custom keystore: decode bytes + read passwords from the bundle.
            jq -r '.keystoreB64' /tmp/signing.json | base64 -d > "$KS_PATH"
            STORE_PW=$(jq -r '.storePassword' /tmp/signing.json)
            KEY_ALIAS=$(jq -r '.keyAlias' /tmp/signing.json)
            KEY_PW=$(jq -r '.keyPassword' /tmp/signing.json)
          else
            # Release + auto. Reuse the per-package keystore if the Worker
            # attached one; otherwise generate a fresh keystore and upload it
            # back so future updates of this package reuse the same key.
            HAS_EXISTING=$(jq -r 'has("existingKeystoreB64")' /tmp/signing.json)
            if [ "$HAS_EXISTING" = "true" ]; then
              echo "Reusing existing keystore for $PACKAGE_NAME"
              jq -r '.existingKeystoreB64' /tmp/signing.json | base64 -d > "$KS_PATH"
              STORE_PW=$(jq -r '.existingCreds.storePassword' /tmp/signing.json)
              KEY_ALIAS=$(jq -r '.existingCreds.keyAlias' /tmp/signing.json)
              KEY_PW=$(jq -r '.existingCreds.keyPassword' /tmp/signing.json)
            else
              echo "Generating a new keystore for $PACKAGE_NAME"
              STORE_PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
              KEY_PW="$STORE_PW"
              KEY_ALIAS="upload"
              GENERATED=true
              keytool -genkeypair -v \
                -keystore "$KS_PATH" \
                -alias "$KEY_ALIAS" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$STORE_PW" -keypass "$KEY_PW" \
                -dname "CN=${PACKAGE_NAME:-app}, OU=WebCraft, O=WebCraft, C=US"
            fi
          fi

          # build.gradle reads this. Written on the runner, never logged.
          cat > app/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF

          # Hand credentials to later steps via env-file (masked), not stdout.
          {
            echo "STORE_PW=$STORE_PW"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PW=$KEY_PW"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PW"
          echo "::add-mask::$KEY_PW"

          # A concrete keystore file now exists at app/release.jks (custom
          # upload, reused, or freshly generated). It is packaged for download
          # in the "Persist & package keystore" step below.
          echo "keystore_source=release-jks" >> "$GITHUB_OUTPUT"

          # Persist as the per-package reuse key ONLY for release builds whose
          # key is not already stored server-side: custom uploads and freshly
          # generated keys. Reused release keys are already stored; a debug key
          # must never become a package's release signing key.
          PERSIST=false
          if [ "$BUILD_TYPE" = "release" ] && { [ "$SIGNING_MODE" = "custom" ] || [ "$GENERATED" = "true" ]; }; then
            PERSIST=true
          fi
          echo "persist_key=$PERSIST" >> "$GITHUB_OUTPUT"

      - name: Build the app
        working-directory: ./Splash_WebView
        env:
          BUILD_TYPE: ${{ steps.signing.outputs.build_type }}
          OUTPUTS_JSON: ${{ toJson(github.event.client_payload.build.outputs) }}
        run: |
          chmod +x gradlew
          # Determine which Gradle tasks to run from build_type + outputs.
          OUTPUTS=$(echo "$OUTPUTS_JSON" | jq -r 'if type=="array" then join(" ") else "apk" end')
          [ -z "$OUTPUTS" ] && OUTPUTS="apk"
          echo "Building type=$BUILD_TYPE outputs=$OUTPUTS"

          TASKS=""
          if [ "$BUILD_TYPE" = "release" ]; then
            case "$OUTPUTS" in
              *apk*) TASKS="$TASKS assembleRelease" ;;
            esac
            case "$OUTPUTS" in
              *aab*) TASKS="$TASKS bundleRelease" ;;
            esac
          else
            TASKS="assembleDebug"
          fi
          echo "Gradle tasks:$TASKS"
          ./gradlew $TASKS --no-daemon

      - name: Upload artifacts to Cloudflare Worker
        env:
          UPLOAD_WEBHOOK: ${{ github.event.client_payload.upload_webhook_url }}
          BUILD_TYPE: ${{ steps.signing.outputs.build_type }}
          OUTPUTS_JSON: ${{ toJson(github.event.client_payload.build.outputs) }}
          BUILD_SECRET: ${{ secrets.WORKER_BUILD_SECRET }}
        run: |
          if [ -z "$UPLOAD_WEBHOOK" ]; then
            echo "::error::upload_webhook_url missing from the dispatch payload"
            exit 1
          fi
          OUTPUTS=$(echo "$OUTPUTS_JSON" | jq -r 'if type=="array" then join(" ") else "apk" end')
          [ -z "$OUTPUTS" ] && OUTPUTS="apk"

          # Add a &type= to the webhook URL (it already has ?uid=&pkg=).
          put_artifact () { # $1=file  $2=type  $3=content-type
            echo "Uploading $2: $1 ($(stat -c%s "$1") bytes)"
            CODE=$(curl -s -o /tmp/up.txt -w "%{http_code}" \
              -X PUT "${UPLOAD_WEBHOOK}&type=$2" \
              -H "X-Build-Secret: $BUILD_SECRET" \
              -H "Content-Type: $3" \
              --data-binary @"$1")
            echo "Worker responded $CODE"; cat /tmp/up.txt; echo
            if [ "$CODE" != "200" ]; then echo "::error::$2 upload failed ($CODE)"; exit 1; fi
          }

          # APK (debug always; release when apk requested)
          if [ "$BUILD_TYPE" = "debug" ] || echo "$OUTPUTS" | grep -q apk; then
            APK_PATH=$(find Splash_WebView/app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -z "$APK_PATH" ]; then echo "::error::No APK produced"; exit 1; fi
            put_artifact "$APK_PATH" apk "application/vnd.android.package-archive"
          fi

          # AAB (release + aab requested)
          if [ "$BUILD_TYPE" = "release" ] && echo "$OUTPUTS" | grep -q aab; then
            AAB_PATH=$(find Splash_WebView/app/build/outputs/bundle -name "*.aab" | head -n 1)
            if [ -z "$AAB_PATH" ]; then echo "::error::No AAB produced"; exit 1; fi
            put_artifact "$AAB_PATH" aab "application/octet-stream"
          fi

      # Package the signing key used by THIS build into a downloadable zip
      # (keystore + credentials.txt) and, for release builds with a new key,
      # persist it as the per-package reuse key. Runs for every build type:
      #   debug  + auto   -> Gradle's default debug keystore (~/.android)
      #   debug  + custom -> the uploaded keystore        (app/release.jks)
      #   release + *     -> custom / reused / generated  (app/release.jks)
      - name: Persist & package keystore
        if: steps.signing.outputs.keystore_source != ''
        working-directory: ./Splash_WebView
        env:
          UPLOAD_WEBHOOK: ${{ github.event.client_payload.upload_webhook_url }}
          SIGNING_FETCH_URL: ${{ github.event.client_payload.build.signing_fetch_url }}
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          BUILD_TYPE: ${{ steps.signing.outputs.build_type }}
          SIGNING_MODE: ${{ steps.signing.outputs.signing_mode }}
          KEYSTORE_SOURCE: ${{ steps.signing.outputs.keystore_source }}
          PERSIST_KEY: ${{ steps.signing.outputs.persist_key }}
          BUILD_SECRET: ${{ secrets.WORKER_BUILD_SECRET }}
        run: |
          if [ "$KEYSTORE_SOURCE" = "debug-default" ]; then
            # Android's default debug keystore, created by Gradle during the
            # debug build. Its credentials are the well-known fixed values.
            KS_PATH="$HOME/.android/debug.keystore"
            STORE_PW=android
            KEY_ALIAS=androiddebugkey
            KEY_PW=android
            KS_FILE_NAME="debug.keystore"
            if [ ! -f "$KS_PATH" ]; then
              echo "Default debug keystore missing; generating one."
              mkdir -p "$HOME/.android"
              keytool -genkeypair -v \
                -keystore "$KS_PATH" \
                -alias "$KEY_ALIAS" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$STORE_PW" -keypass "$KEY_PW" \
                -dname "CN=Android Debug, O=Android, C=US"
            fi
          else
            # Custom / reused / generated release key written by the signing
            # step. STORE_PW / KEY_ALIAS / KEY_PW are already in the env.
            KS_PATH="$PWD/app/release.jks"
            KS_FILE_NAME="release.jks"
          fi

          echo "::add-mask::$STORE_PW"
          echo "::add-mask::$KEY_PW"

          if [ ! -f "$KS_PATH" ]; then
            echo "::error::Keystore file not found at $KS_PATH"; exit 1
          fi

          # 1. Build the user-downloadable bundle: keystore + a readme of creds.
          cat > /tmp/credentials.txt <<EOF
          Keep this file safe. You need this exact keystore to publish updates
          to your app - a different keystore cannot update it on Google Play.

          Package:        $PACKAGE_NAME
          Build type:     $BUILD_TYPE
          Keystore file:  $KS_FILE_NAME
          Store password: $STORE_PW
          Key alias:      $KEY_ALIAS
          Key password:   $KEY_PW
          EOF
          cp "$KS_PATH" "/tmp/$KS_FILE_NAME"
          (cd /tmp && zip -q keystore.zip "$KS_FILE_NAME" credentials.txt)

          curl -s -f -X PUT "${UPLOAD_WEBHOOK}&type=keystore" \
            -H "X-Build-Secret: $BUILD_SECRET" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/keystore.zip \
            || { echo "::error::keystore zip upload failed"; exit 1; }

          # 1b. Record the keystore's passwords + metadata on the build's
          #     Firestore doc (users/{uid}/builds/{buildId}.keystore) so the app
          #     can show them and reuse this exact key for future updates. Runs
          #     for every build; the same creds are inside the zip above.
          #     Best-effort: a Firestore hiccup must not fail an otherwise good
          #     build (the downloadable zip remains the source of truth).
          KS_INFO_URL="${UPLOAD_WEBHOOK/\/api\/upload\//\/api\/keystore-info\/}"
          curl -s -f -X POST "$KS_INFO_URL" \
            -H "X-Build-Secret: $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg f "$KS_FILE_NAME" --arg s "$STORE_PW" --arg a "$KEY_ALIAS" \
                  --arg k "$KEY_PW" --arg t "$BUILD_TYPE" --arg m "$SIGNING_MODE" \
                  --arg src "$KEYSTORE_SOURCE" \
                  '{file:$f, store_password:$s, key_alias:$a, key_password:$k, build_type:$t, signing_mode:$m, source:$src}')" \
            || echo "::warning::keystore-info post failed (non-fatal)"

          # 2. Persist as the per-package reuse key (release + new key only), so
          #    future builds of this package reuse the same signing key. This is
          #    the same store that auto-generated keys are saved to.
          if [ "$PERSIST_KEY" = "true" ]; then
            curl -s -f -X PUT "${UPLOAD_WEBHOOK}&type=package-key&pkgkey=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['PACKAGE_NAME']))")" \
              -H "X-Build-Secret: $BUILD_SECRET" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$KS_PATH" || { echo "::error::keystore persist failed"; exit 1; }

            # Keep the ?uid= query from the signing URL so the Worker stores the
            # creds under {uid}/, paired with the .jks bytes above.
            CREDS_URL="${SIGNING_FETCH_URL%%\?*}/creds?${SIGNING_FETCH_URL#*\?}"
            curl -s -f -X POST "$CREDS_URL" \
              -H "X-Build-Secret: $BUILD_SECRET" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg p "$PACKAGE_NAME" --arg s "$STORE_PW" --arg a "$KEY_ALIAS" --arg k "$KEY_PW" \
                    '{package:$p, store_password:$s, key_alias:$a, key_password:$k}')" \
              || { echo "::error::creds persist failed"; exit 1; }
          fi

      - name: Clean up signing material
        if: always()
        working-directory: ./Splash_WebView
        run: |
          rm -f app/keystore.properties app/release.jks /tmp/signing.json \
                /tmp/release.jks /tmp/debug.keystore /tmp/credentials.txt \
                /tmp/keystore.zip || true

      # Runs only if any earlier step failed (customise, build, or upload).
      # Reports FAILED to the Worker so the app's Firestore listener stops
      # waiting and shows an error instead of spinning forever.
      - name: Report build failure
        if: failure()
        env:
          STATUS_WEBHOOK: ${{ github.event.client_payload.status_webhook_url }}
          BUILD_SECRET: ${{ secrets.WORKER_BUILD_SECRET }}
        run: |
          if [ -z "$STATUS_WEBHOOK" ]; then
            echo "status_webhook_url missing; nothing to report"
            exit 0
          fi
          curl -s -X POST "$STATUS_WEBHOOK" \
            -H "X-Build-Secret: $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED"}' || true

